name: 发布 Windows 桌面版

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验四处版本号一致
        # VERSION / desktop/package.json / Cargo.toml / tauri.conf.json 必须同版本。
        # 校验逻辑与 code-check.yml 共用同一个桌面脚本，避免两处规则漂移。
        shell: pwsh
        run: ./desktop/scripts/verify-versions.ps1

      - name: 校验标签与应用版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Git 标签 $env:GITHUB_REF_NAME 与应用版本 v$version 不一致"
          }

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      - name: 准备内置 ffmpeg
        # Python sidecar 移除后，ffmpeg 改由 Tauri 的 bundle.resources 随包分发。
        # ffmpeg.exe 有 84MB，不进 git（.gitignore 已排除），改在 CI 现装现拷。
        # 这一步失败就直接中断 —— 没有 ffmpeg 的安装包装完是不能渲染的。
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $real = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          if (-not $real) { throw 'CI 里找不到真正的 ffmpeg.exe（choco shim 不能直接拷走）' }
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Copy-Item $real.FullName desktop/src-tauri/resources/ffmpeg.exe -Force
          $size = (Get-Item desktop/src-tauri/resources/ffmpeg.exe).Length
          Write-Host "ffmpeg 已就位: $($size / 1MB) MB"
          if ($size -lt 10MB) { throw 'ffmpeg.exe 体积异常，可能拷到了 shim' }

      - name: 校验 ffmpeg 已就位
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/src-tauri/resources/ffmpeg.exe')) {
            throw '缺少 desktop/src-tauri/resources/ffmpeg.exe，安装包将不带 ffmpeg'
          }

      - name: 构建并发布安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: 图转视频极速版 v__VERSION__
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          args: --bundles nsis

      - name: 写入具体发布说明
        # 从 RELEASE_NOTES.md 中提取当前版本小节，替换自动生成的发布说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "RELEASE_NOTES.md"
          if (-not (Test-Path $notesPath)) { Write-Host "未找到 RELEASE_NOTES.md，跳过"; exit 0 }
          $content = Get-Content -Raw $notesPath
          $pattern = "(?sm)##\s+v" + [regex]::Escape($version) + ".*?(?=^##\s+|\z)"
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { Write-Host "RELEASE_NOTES.md 中没有 v$version 小节，跳过"; exit 0 }
          $body = $match.Value.Trim()
          $tmp = Join-Path $env:RUNNER_TEMP "release-notes.md"
          [System.IO.File]::WriteAllText($tmp, $body, [System.Text.UTF8Encoding]::new($false))
          gh release edit "v$version" --repo $env:GITHUB_REPOSITORY --notes-file $tmp
          Write-Host "已写入 v$version 发布说明"

      - name: 同步更新文件到 Gitee 镜像（可选）
        # 未配置 GITEE_TOKEN / GITEE_REPO 时，脚本会直接跳过，不影响发布
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          $version = (Get-Content -Raw desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./desktop/scripts/sync-gitee.ps1 -Version $version -GiteeRepo $env:GITEE_REPO -GiteeToken $env:GITEE_TOKEN
