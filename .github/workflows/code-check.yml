name: 代码检查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-tests:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest

      - name: 运行引擎测试
        run: python -m pytest tests -q

  frontend-checks:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      - name: 类型检查
        working-directory: desktop
        run: npx tsc --noEmit

      - name: 前端单元测试
        working-directory: desktop
        run: npm run test

      - name: 生产构建
        working-directory: desktop
        run: npm run build
