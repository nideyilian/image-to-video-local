name: 代码检查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-consistency:
    # README 要求 VERSION / package.json / Cargo.toml / tauri.conf.json 四处版本号同步。
    # 漏改任何一处都不会报错，但会让安装包版本、Rust crate 版本与仓库记录对不上，
    # 只在事后倒查时才暴露（历史上漏过 Cargo.toml）。校验脚本与发布流程共用。
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验四处版本号一致
        shell: pwsh
        run: ./desktop/scripts/verify-versions.ps1

  python-tests:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest

      - name: 准备 ffmpeg（含 ffprobe，测试用）
        # runner 上可能只有 ffmpeg 没有 ffprobe；素材库时长/音轨探测依赖 ffprobe
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -TimeoutSec 300
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg") -Force
          $ffmpeg = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg 下载失败" }
          $binDir = Split-Path $ffmpeg.FullName
          Add-Content $env:GITHUB_PATH $binDir
          & (Join-Path $binDir "ffmpeg.exe") -version | Select-Object -First 1
          & (Join-Path $binDir "ffprobe.exe") -version | Select-Object -First 1

      - name: 运行引擎测试
        run: python -m pytest tests -q

  frontend-checks:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      - name: 类型检查
        working-directory: desktop
        run: npx tsc --noEmit

      - name: 前端单元测试
        working-directory: desktop
        run: npm run test

      - name: 生产构建
        working-directory: desktop
        run: npm run build
