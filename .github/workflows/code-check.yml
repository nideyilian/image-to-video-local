name: 代码检查

on:
  pull_request:
  push:
    branches: [main]

jobs:
  version-consistency:
    # README 要求 VERSION / package.json / Cargo.toml / tauri.conf.json 四处版本号同步。
    # 漏改任何一处都不会报错，但会让安装包版本、Rust crate 版本与仓库记录对不上，
    # 只在事后倒查时才暴露（历史上漏过 Cargo.toml）。校验脚本与发布流程共用。
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验四处版本号一致
        shell: pwsh
        run: ./desktop/scripts/verify-versions.ps1

  python-tests:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest

      - name: 准备 ffmpeg（含 ffprobe，测试用）
        # runner 上可能只有 ffmpeg 没有 ffprobe；素材库时长/音轨探测依赖 ffprobe
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zip -TimeoutSec 300
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "ffmpeg") -Force
          $ffmpeg = Get-ChildItem (Join-Path $env:RUNNER_TEMP "ffmpeg") -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg 下载失败" }
          $binDir = Split-Path $ffmpeg.FullName
          Add-Content $env:GITHUB_PATH $binDir
          & (Join-Path $binDir "ffmpeg.exe") -version | Select-Object -First 1
          & (Join-Path $binDir "ffprobe.exe") -version | Select-Object -First 1

      - name: 运行引擎测试
        run: python -m pytest tests -q

  frontend-checks:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci

      - name: 类型检查
        working-directory: desktop
        run: npx tsc --noEmit

      - name: 前端单元测试
        working-directory: desktop
        run: npm run test

      - name: 生产构建
        working-directory: desktop
        run: npm run build

  rust-checks:
    # Rust 内核的格式 / lint / 单元测试。
    # 2026-11-20 之前这里一条都没有：Rust 代码能不能合只靠本地自觉 ——
    # 结果「特效预览支持清单」跟实现脱节了很久都没人发现（详见当日提交）。
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Rust（含 rustfmt 与 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: 准备内置 ffmpeg
        # `engine/embedded_ffmpeg.rs` 用 `include_bytes!` 把 ffmpeg.exe 编进二进制，
        # 缺文件连 cargo check 都过不去。ffmpeg.exe 有 84MB 不进 git，这里现装现拷。
        # 同时把目录塞进 PATH —— 一部分单元测试会真的调 ffmpeg。
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          $real = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          if (-not $real) { throw 'CI 里找不到真正的 ffmpeg.exe（choco shim 不能直接拷走）' }
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Copy-Item $real.FullName desktop/src-tauri/resources/ffmpeg.exe -Force
          Add-Content $env:GITHUB_PATH (Split-Path $real.FullName)
          Write-Host "ffmpeg 已就位: $((Get-Item desktop/src-tauri/resources/ffmpeg.exe).Length / 1MB) MB"

      - name: 格式检查
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy（警告即失败）
        # 新增 clippy 规则让 CI 变红时，正确做法是修掉、或就地 allow 并写明理由，
        # 不要把这一步删掉 —— 那等于把刚补上的门又拆了。
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust 单元测试
        working-directory: desktop/src-tauri
        run: cargo test --lib
